name: Weekly SPY refresh

# Reruns the walk-forward experiment on fresh data, appends this week's call
# to data/ledger.json (append-only, past calls are never rewritten), and
# writes web/public/data/lab.json. Committing to main triggers a Vercel
# redeploy through its Git integration.

on:
  schedule:
    # Sunday 14:00 UTC (after Friday's close is settled, before Monday's open)
    - cron: "0 14 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build this week's call and site data
        run: python -m scripts.build_site

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ledger.json web/public/data/lab.json
          git diff --cached --quiet || git commit -m "Weekly data refresh"
          git push
